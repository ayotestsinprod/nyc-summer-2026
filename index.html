<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW YORK — Summer 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --fg: #f5f0eb;
    --muted: #8a8580;
    --accent: #d4a574;
    --section-gap: 120px;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* Hero */
  .hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,10,10,0.3) 0%, rgba(10,10,10,0.8) 100%);
    z-index: 1;
  }
  .hero-bg {
    position: absolute;
    inset: -20px;
    background-size: cover;
    background-position: center;
    filter: blur(2px);
    transform: scale(1.05);
    transition: opacity 1.5s ease;
  }
  .hero-content {
    position: relative;
    z-index: 2;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 10vw, 8rem);
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.2em;
  }
  .hero .subtitle {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(1rem, 3vw, 1.8rem);
    color: var(--accent);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
  .hero .scroll-hint {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    animation: pulse 2s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Section headers */
  .section-header {
    padding: var(--section-gap) 40px 40px;
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
  }
  .section-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 3.5rem);
    font-weight: 400;
    letter-spacing: 0.08em;
    margin-bottom: 0.5em;
  }
  .section-header p {
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    max-width: 500px;
    margin: 0 auto;
  }
  .section-divider {
    width: 60px;
    height: 1px;
    background: var(--accent);
    margin: 0 auto 1.5em;
  }

  /* Gallery grid */
  .gallery {
    padding: 0 20px;
    max-width: 1400px;
    margin: 0 auto;
    column-count: 3;
    column-gap: 16px;
  }
  .gallery-item {
    break-inside: avoid;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    border-radius: 2px;
  }
  .gallery-item img {
    width: 100%;
    display: block;
    transition: transform 0.6s ease, filter 0.6s ease;
  }
  .gallery-item:hover img {
    transform: scale(1.03);
    filter: brightness(0.7);
  }
  .gallery-item .credit {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 40px 16px 16px;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .gallery-item:hover .credit {
    opacity: 1;
  }
  .credit .photographer {
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.05em;
  }
  .credit .caption {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 2px;
    font-style: italic;
  }

  /* Full-bleed single image */
  .full-bleed {
    width: 100%;
    height: 80vh;
    margin: var(--section-gap) 0;
    position: relative;
    overflow: hidden;
  }
  .full-bleed img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .full-bleed .overlay-text {
    position: absolute;
    bottom: 40px;
    right: 40px;
    text-align: right;
    z-index: 1;
  }
  .full-bleed .overlay-text .quote {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(1.2rem, 3vw, 2rem);
    max-width: 400px;
  }
  .full-bleed .overlay-text .attr {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 8px;
    letter-spacing: 0.1em;
  }

  /* Diptych */
  .diptych {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 0 20px;
    max-width: 1400px;
    margin: 40px auto;
  }
  .diptych img {
    width: 100%;
    height: 500px;
    object-fit: cover;
    border-radius: 2px;
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    cursor: zoom-out;
  }
  .lightbox.active {
    display: flex;
  }
  .lightbox img {
    max-width: 92vw;
    max-height: 92vh;
    object-fit: contain;
  }
  .lightbox .lb-info {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .lightbox .lb-close {
    position: absolute;
    top: 24px;
    right: 24px;
    font-size: 1.5rem;
    color: var(--fg);
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 60px;
    padding: 60px 20px;
    border-top: 1px solid rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    margin: var(--section-gap) auto;
    max-width: 800px;
  }
  .stat { text-align: center; }
  .stat .number {
    font-family: 'Playfair Display', serif;
    font-size: 2.5rem;
    color: var(--accent);
  }
  .stat .label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
  }
  .footer a {
    color: var(--accent);
    text-decoration: none;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .gallery { column-count: 2; }
    .diptych img { height: 300px; }
    .stats-bar { gap: 30px; }
  }
  @media (max-width: 600px) {
    .gallery { column-count: 1; column-gap: 12px; }
    .gallery-item { margin-bottom: 12px; }
    .section-header { padding: 80px 20px 20px; }
    .diptych { grid-template-columns: 1fr; }
    .diptych img { height: 250px; }
    .stats-bar { flex-wrap: wrap; gap: 20px 40px; }
    :root { --section-gap: 80px; }
  }

  /* Loading */
  .loading {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 60vh;
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

<div class="hero" id="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-content">
    <h1>New York</h1>
    <div class="subtitle">Summer 2026</div>
  </div>
  <div class="scroll-hint">Scroll to explore</div>
</div>

<div class="stats-bar">
  <div class="stat"><div class="number" id="statPhotos">—</div><div class="label">Photographs</div></div>
  <div class="stat"><div class="number" id="statPhotographers">—</div><div class="label">Photographers</div></div>
  <div class="stat"><div class="number">49</div><div class="label">Summer Days</div></div>
</div>

<div id="content">
  <div class="loading">Loading photographs...</div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">&times;</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-info" id="lbInfo"></div>
</div>

<div class="footer">
  <p>A collection of New York City photography from Summer 2026</p>
  <p style="margin-top: 8px">All photographs belong to their respective creators</p>
</div>

<script>
const SECTIONS = [
  {
    id: 'bridges',
    title: 'Bridges',
    desc: 'Steel, stone, and the spaces between boroughs',
    keywords: ['brooklyn bridge', 'manhattan bridge', 'bridge', 'dumbo'],
  },
  {
    id: 'skyline',
    title: 'Skyline & Towers',
    desc: 'The vertical city — Empire State, One World Trade, Hudson Yards',
    keywords: ['empire state', 'wtc', 'world trade', 'hudson yards', 'skyline', 'one vanderbilt', 'summit', 'towers', 'lower manhattan'],
  },
  {
    id: 'film',
    title: 'On 35mm Film',
    desc: 'The grain, the light, the imperfection',
    keywords: ['35mm', 'film', 'fujifilm'],
  },
  {
    id: 'dawn',
    title: 'Dawn & Dusk',
    desc: 'The city at its edges — sunrise, sunset, moonrise',
    keywords: ['sunrise', 'sunset', 'dawn', 'dusk', 'moonrise', 'morning', 'early bird', 'pretty in pink', 'smokey start'],
  },
  {
    id: 'rain',
    title: 'Rain & Smoke',
    desc: 'When the city gets moody',
    keywords: ['rain', 'rainy', 'storm', 'smoke', 'wildfire', 'neon rain'],
  },
  {
    id: 'streets',
    title: 'Summer Streets',
    desc: 'Canal Street, Fifth Avenue, Times Square — the city at street level',
    keywords: ['canal st', 'fifth avenue', 'crossings', 'times square', 'street', 'light walk', 'neon'],
  },
  {
    id: 'brooklyn',
    title: 'Brooklyn',
    desc: 'The borough across the river',
    keywords: ['brooklyn heights', 'brooklyn,', 'queens across'],
  },
  {
    id: 'liberty',
    title: 'Lady Liberty',
    desc: 'Summer statue sunrises',
    keywords: ['statue', 'liberty'],
  },
  {
    id: 'summer',
    title: 'Summer in the City',
    desc: 'The rest — golden light, urban life, that energy',
    keywords: [],
    catchAll: true,
  },
];

function imgUrl(url, size) {
  return url.replace('?name=orig', `?name=${size || 'medium'}`);
}

function categorize(tweets) {
  const assigned = new Set();
  const sections = SECTIONS.map(s => ({ ...s, photos: [] }));

  for (const section of sections) {
    if (section.catchAll) continue;
    for (const tweet of tweets) {
      const text = (tweet.text + ' ' + tweet.author_name).toLowerCase();
      const match = section.keywords.some(kw => text.includes(kw));
      if (match) {
        for (const photo of tweet.photos) {
          const key = photo.url;
          if (!assigned.has(key)) {
            assigned.add(key);
            section.photos.push({ ...photo, tweet });
          }
        }
      }
    }
  }

  const catchAll = sections.find(s => s.catchAll);
  for (const tweet of tweets) {
    for (const photo of tweet.photos) {
      if (!assigned.has(photo.url)) {
        assigned.add(photo.url);
        catchAll.photos.push({ ...photo, tweet });
      }
    }
  }

  return sections.filter(s => s.photos.length > 0);
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function openLightbox(url, name, caption) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lbImg').src = url.replace('?name=medium', '?name=large');
  document.getElementById('lbInfo').textContent = name + (caption ? ' — ' + caption : '');
  lb.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeLightbox();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

async function init() {
  const resp = await fetch('images.json');
  const data = await resp.json();
  const tweets = data.tweets;

  const totalPhotos = tweets.reduce((sum, t) => sum + t.photos.length, 0);
  const uniquePhotographers = new Set(tweets.map(t => t.handle.toLowerCase())).size;

  document.getElementById('statPhotos').textContent = totalPhotos;
  document.getElementById('statPhotographers').textContent = uniquePhotographers;

  // Hero background
  const heroTweet = tweets.find(t => t.handle === 'viewfinderthis' && t.photos.length > 0);
  if (heroTweet) {
    document.getElementById('heroBg').style.backgroundImage =
      `url(${imgUrl(heroTweet.photos[0].url, 'large')})`;
  }

  const sections = categorize(tweets);
  const content = document.getElementById('content');
  content.innerHTML = '';

  for (const section of sections) {
    // Section header
    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <div class="section-divider"></div>
      <h2>${section.title}</h2>
      <p>${section.desc}</p>
    `;
    content.appendChild(header);

    // Pick a standout photo for full-bleed if section has enough
    let fullBleedPhoto = null;
    if (section.photos.length > 6) {
      const landscape = section.photos.find(p => p.width > p.height);
      if (landscape) {
        fullBleedPhoto = landscape;
        const fb = document.createElement('div');
        fb.className = 'full-bleed';
        fb.innerHTML = `<img src="${imgUrl(landscape.url, 'large')}" alt="${landscape.tweet.text}" loading="lazy">`;
        content.appendChild(fb);
      }
    }

    // Gallery
    const gallery = document.createElement('div');
    gallery.className = 'gallery';

    const photos = shuffleArray([...section.photos].filter(p => p !== fullBleedPhoto));

    for (const photo of photos) {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.onclick = () => openLightbox(photo.url, photo.tweet.author_name, photo.tweet.text);
      item.innerHTML = `
        <img src="${imgUrl(photo.url, 'medium')}" alt="${photo.tweet.text}" loading="lazy">
        <div class="credit">
          <div class="photographer">@${photo.tweet.handle}</div>
          <div class="caption">${photo.tweet.text}</div>
        </div>
      `;
      gallery.appendChild(item);
    }

    content.appendChild(gallery);
  }
}

init();
</script>
</body>
</html>
